x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: [.env]
  environment: &env
    DATABASE_URL: postgresql+psycopg2://attendance:attendance@postgres:5432/attendance
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./data:/srv/data
    - ./models:/srv/models
    - ./config.yaml:/srv/config.yaml:ro
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.api.main:get_app --factory --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      retries: 5

  worker:
    <<: *app
    command: python -m app.worker
    depends_on:
      api: {condition: service_healthy}
    # webcams on Linux: devices: ["/dev/video0:/dev/video0"]

  dashboard:
    <<: *app
    environment:
      <<: *env
      API_URL: http://api:8000
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
